name: build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build both architectures
        run: ./build.sh

      - name: Run checks
        run: ./test.sh

      - name: Both slices present
        run: |
          lipo -info build/Bottleneck.app/Contents/MacOS/Bottleneck | tee /dev/stderr \
            | grep -q "x86_64 arm64"

      - name: Deployment targets are what the README claims
        run: |
          # Swift's ABI-stable runtime arrived in the OS in 10.14.4, and the app
          # embeds no Swift libraries, so anything lower would fail to load.
          otool -l -arch x86_64 build/Bottleneck.app/Contents/MacOS/Bottleneck \
            | grep -A3 -E 'LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION' \
            | grep -qE 'version 10\.14\.4|minos 10\.14\.4'
          otool -l -arch arm64 build/Bottleneck.app/Contents/MacOS/Bottleneck \
            | grep -A3 LC_BUILD_VERSION | grep -q 'minos 11\.0'

      - name: Publish the checksum of this build
        run: shasum -a 256 build/Bottleneck.app/Contents/MacOS/Bottleneck
